name: Publish

# Tag a release and this publishes it. Nothing publishes from a branch, so a
# merge can never reach a carrier's site on its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Lets npm attach provenance: proof that the tarball on npm was built from
  # this commit in this repository, which a carrier can verify.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+ and Node 22.14+. Node 24
          # carries npm 11, and npm is pinned below anyway so a future npm
          # major cannot change how a release behaves without us choosing it.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@^11.5.1

      - name: The tag matches the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
